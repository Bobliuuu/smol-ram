# python3 ~/video-readme-maker/vrm.py all README.spec.yml   (numbers: tools/readme_data.py from reports/)
project:
  name: smol-ram
  emoji: "🪶"
  tagline: "Run very large models under a hard 8 GB RAM cap by shrinking what each token must read from SSD"
  repo: Bobliuuu/smol-ram
hero:
  title: smol-ram
  subtitle: "bytes on disk are close to bytes read per token, so smaller is faster"
  chips: [8 GB RAM cap, SSD streaming, Kimi K3.1 Pro, lossless + lossy levers]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: RAM cap, message: "8 GB", color: 27c8e8}
  - {label: first target, message: "Kimi K3.1 Pro · {{ n.total_gb.text }}", color: ff6b6b}
  - {label: lossless, message: "{{ n.ll_native.text }} to {{ n.ll_entropy.text }}", color: 3ddc97}
  - {label: release, message: "v0.1.0", color: 27c8e8, link: "https://github.com/Bobliuuu/smol-ram/releases/tag/v0.1.0"}
  - {label: Hugging Face, message: "reports dataset", color: ffd21e, logo: huggingface, link: "https://huggingface.co/datasets/Bobliu/smol-ram-reports"}
  - {label: python, message: "3.x", color: 3776ab, logo: python}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "🧰", label: Tools, anchor: tools}
  - {emoji: "📦", label: Where the bytes are, anchor: bytes}
  - {emoji: "🗜️", label: Lossless, anchor: lossless}
  - {emoji: "🔪", label: Lossy levers, anchor: lossy}
